<html>
<body bgcolor="pink">

<h1>
<center>
<i>STRING AND MATH FUNCTIONS</i>
</center>
</h1>
<script>
var a = "hello";
var b = "welcome,";
var c = "i am liya";
document.write("String 1: " + a + "<br><br>");
document.write("String 2: " + b + "<br><br>");
document.write("String 3: " + c + "<br><br>");
document.write("<h2>STRING FUNCTIONS</h2>");
document.write("Concatenation: " + a + " " + b + " " + c + "<br><br>");
document.write("Uppercase: " + a.toUpperCase() + "<br><br>");
document.write("Lowercase: " + a.toLowerCase() + "<br><br>");
document.write("Length: " + a.length + "<br><br>");
document.write("Character at 1: " + a.charAt(1) + "<br><br>");
document.write("Index of l: " + a.indexOf("l") + "<br><br>");
document.write("<h2>MATH FUNCTIONS</h2>");
document.write("Absolute value: " + Math.abs(-10) + "<br><br>");
document.write("Square root: " + Math.sqrt(25) + "<br><br>");
document.write("Power: " + Math.pow(2, 3) + "<br><br>");
document.write("Round: " + Math.round(4.6) + "<br><br>");
document.write("Ceiling: " + Math.ceil(4.2) + "<br><br>");
document.write("Floor: " + Math.floor(4.8) + "<br><br>");
document.write("Maximum: " + Math.max(10, 20, 30) + "<br><br>");
document.write("Minimum: " + Math.min(10, 20, 30) + "<br><br>");
document.write("Random: " + Math.random() + "<br><br>");
document.write("PI: " + Math.PI + "<br><br>");
</script>
</body>
</html>
